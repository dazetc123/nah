# =====================================================================
# Cấu hình riêng khi CHẠY KIỂM THỬ TỰ ĐỘNG (profile "test").
# Chỉ được dùng bởi các lớp test có @ActiveProfiles("test"), KHÔNG ảnh hưởng khi chạy app thật.
# =====================================================================

# CSDL H2 trong bộ nhớ (giả lập MySQL): mỗi lần chạy test là một CSDL trống, chạy xong tự xoá
spring.datasource.url=jdbc:h2:mem:betong_test_${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Ảnh upload khi test được ghi vào target/ (không làm bẩn thư mục dự án)
app.upload-dir=target/test-uploads

# Tắt quét hết hạn tự động (1 giờ/lần); test hết hạn sẽ gọi trực tiếp bộ quét
app.dieu-phoi.quet-het-han-ms=3600000

logging.level.root=WARN
