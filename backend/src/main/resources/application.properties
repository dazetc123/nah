spring.application.name=betong
# ===================== DATASOURCE (MySQL - kh?p connection "quanly_betong" trong DBeaver) =====================
spring.datasource.url=jdbc:mysql://localhost:3306/quanly_betong?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================== JPA / HIBERNATE =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================== SERVER =====================
server.port=8080
server.servlet.session.cookie.name=BETONG_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.path=/
server.servlet.session.timeout=10m

# ===================== SWAGGER =====================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===================== JWT =====================
# Đặt biến môi trường JWT_SECRET (>= 32 ký tự) khi chạy thật; giá trị mặc định chỉ để chạy thử trên máy cá nhân
jwt.secret=${JWT_SECRET:dev-only-betong-jwt-secret-change-me-0123456789abcdef}
jwt.expiration=86400000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_PASSWORD}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.sms.webhook-url=
app.oauth2.login-url=${APP_LOGIN_URL:http://localhost:5173/login}
app.upload-dir=uploads
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
app.client-key=${APP_CLIENT_KEY:betong-web-local}
app.mobile-client-key=${APP_MOBILE_CLIENT_KEY:betongmobile}

# ===================== GOOGLE OAUTH2 =====================
# Set these environment variables in the runtime environment.
# Authorized redirect URI in Google Cloud Console:
# http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google